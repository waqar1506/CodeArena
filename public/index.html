<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeArena — Online Coding Judge</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127937;</text></svg>" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="#/">
        <span class="brand-mark">&lt;/&gt;</span>
        <span class="brand-name">Code<em>Arena</em></span>
      </a>
      <nav class="nav" id="main-nav">
        <a href="#/problems" data-nav="problems">Problems</a>
        <a href="#/contests" data-nav="contests">Contests</a>
        <a href="#/leaderboard" data-nav="leaderboard">Leaderboard</a>
        <a href="#/submissions" data-nav="submissions">Submissions</a>
        <a href="#/admin" data-nav="admin" id="nav-admin" hidden>Admin</a>
      </nav>
      <div class="auth-area" id="auth-area"></div>
    </div>
  </header>

  <main class="container" id="app">
    <div class="loading-screen">Loading…</div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>CodeArena — online coding judge</span>
      <span class="muted">Verdicts: AC · WA · TLE · MLE · RE · CE · OLE</span>
    </div>
  </footer>

  <div id="toasts" class="toasts"></div>

  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
